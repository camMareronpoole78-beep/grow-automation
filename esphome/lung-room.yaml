# ESPHome node for the shared lung room.
# This reading is what drives the humidifier/dehumidifier automation —
# it's the actual air those two units are acting on.
#
# Wiring (BME280 breakout -> ESP32 DevKitC):
#   VIN -> 3V3      GND -> GND
#   SCL -> GPIO22   SDA -> GPIO21
#
# Flash with: esphome run lung-room.yaml  (from this folder, with secrets.yaml present)

substitutions:
  name: lung-room-sensor
  friendly_name: "Lung Room"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:
logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: bme280_i2c
    address: 0x76  # if the node never shows up in HA, check the boot log for
                    # the i2c scan result — some boards ship at 0x77 instead
    update_interval: 60s
    temperature:
      name: "${friendly_name} Temperature"
      id: lung_room_temp
      unit_of_measurement: "°F"
      filters:
        - lambda: return x * (9.0/5.0) + 32.0;  # BME280 reports C natively
    humidity:
      name: "${friendly_name} Humidity"
      id: lung_room_hum
    pressure:
      name: "${friendly_name} Pressure"

  - platform: template
    name: "${friendly_name} VPD"
    unit_of_measurement: "kPa"
    accuracy_decimals: 2
    icon: "mdi:water-thermometer"
    update_interval: 60s
    lambda: |-
      float t_f = id(lung_room_temp).state;
      float t_c = (t_f - 32.0) * (5.0/9.0);
      float rh = id(lung_room_hum).state;
      float svp = 0.61078 * exp((17.27 * t_c) / (t_c + 237.3));
      float vpd = svp * (1.0 - (rh / 100.0));
      return vpd;
